name: CI
jobs:
  test:
    strategy:
      matrix:
        go:
        - stable
        os:
        - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
    - name: Test
      run: go test ./... -coverprofile=coverage.txt
    - name: Update README.md
      if: success()
      run: |
        sed -i "s|go get github.com/oneclickvirt/fio@.*|go get github.com/oneclickvirt/fio@${TAG}|" README.md
      env:
        TAG: ${{ env.TAG }}
    - name: Commit and Push README.md
      if: success()
      run: |
        set -euo pipefail
        # CI does not define TAG; avoid a no-op commit failure on hosted runners.
        if [[ -z "${TAG:-}" ]]; then
          echo 'No release tag was supplied; skipping README commit.'
        elif ! git diff --quiet -- README.md; then
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Update README.md with new tag ${TAG}"
          git push origin main
        else
          echo 'README.md unchanged; skipping commit.'
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    env:
      GOPROXY: https://proxy.golang.org|direct
  publish-validated-native-binaries:
    needs: test
    uses: ./.github/workflows/build_fio.yml
    secrets: inherit
'on':
  workflow_dispatch: null
permissions:
  contents: write
